<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t">
<title id="t">ARTDUO — Soft Machines</title>
<defs>
  <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 .18"/></feComponentTransfer>
  </filter>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="70"/></filter>
  <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity=".35"/></filter>
  
</defs>
<rect width="1200" height="630" fill="#0b0b0c"/><circle cx="930" cy="315" r="250" fill="#ff4a2e" opacity=".95"/><circle cx="1040" cy="390" r="190" fill="#efe7da" opacity=".85" style="mix-blend-mode:screen"/><text x="70" y="300" fill="#efe7da" font-family="Georgia, serif" font-size="176" letter-spacing="-8">ARTDUO</text><text x="76" y="380" fill="#efe7da" font-family="ui-monospace, Menlo, monospace" font-size="22" letter-spacing="8" opacity=".7">SOFT MACHINES — ONLINE EXHIBITION</text><text x="76" y="540" fill="#efe7da" font-family="ui-monospace, Menlo, monospace" font-size="18" letter-spacing="3" opacity=".5">LIN × QIAO / 2026—2027</text>
<rect width="1200" height="630" filter="url(#grain)" opacity=".55" style="mix-blend-mode:overlay"/>
</svg>
