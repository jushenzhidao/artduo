<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" width="900" height="1125" role="img" aria-labelledby="t">
<title id="t">Red Fold 06</title>
<defs>
  <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 .18"/></feComponentTransfer>
  </filter>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="70"/></filter>
  <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity=".35"/></filter>
  
</defs>
<rect width="900" height="1125" fill="#efe7da"/><polygon points="0,1125 900,190 900,1125" fill="#0b0b0c"/><polygon points="0,0 650,0 180,760 0,760" fill="#ff4a2e"/><polygon points="650,0 900,0 900,520 520,300" fill="#f0bfb4"/><polygon points="180,760 650,0 900,190 520,905" fill="#efe7da" opacity=".9"/><line x1="180" y1="760" x2="900" y2="190" stroke="#0b0b0c" stroke-width="2"/><circle cx="180" cy="760" r="8" fill="#0b0b0c"/><text x="42" y="1082" fill="#efe7da" font-family="ui-monospace, Menlo, monospace" font-size="18" letter-spacing="2" opacity=".65">RED FOLD — 06</text>
<rect width="900" height="1125" filter="url(#grain)" opacity=".55" style="mix-blend-mode:overlay"/>
</svg>
