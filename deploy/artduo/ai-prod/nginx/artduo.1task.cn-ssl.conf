# artduo.1task.cn :443 —— 即梦复刻站
#
# 公开访问：不带 Basic Auth，打开即用。
# 写接口保留服务端同源校验（JIMENG_PUBLIC_HOSTS + Origin 精确匹配），
# 回收站目录不对公网开放。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name artduo.1task.cn;

    ssl_certificate     /www/server/panel/vhost/cert/artduo.1task.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/artduo.1task.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /www/wwwlogs/artduo.1task.cn.log;
    error_log  /www/wwwlogs/artduo.1task.cn.error.log;

    client_max_body_size 64m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 生成目录：nginx 直出（容器只写不读），支持 Range 播放
    location /assets/generated/ {
        alias /opt/artduo/data/generated/;
        autoindex off;
        add_header Cache-Control "public, max-age=86400";
        add_header Accept-Ranges bytes;
    }

    # 主体参考图：量小，也直出
    location /assets/subjects/ {
        alias /opt/artduo/data/subjects/;
        autoindex off;
        add_header Cache-Control "public, max-age=86400";
    }

    # 回收站不给公网看（页面里的预览会坏，但内容不该被任何人翻）
    location /assets/_trash/ {
        return 404;
    }

    # 配置类接口：读放行（页面要显示当前模型/地址），写一律拒绝。
    # 改上游请改 /opt/artduo/.env 后重启容器，避免陌生人把 base 指向自己的服务器。
    location ~ ^/api/(config|quickcfg)$ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:39210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/config/test { return 404; }
    # 纯调试接口，前端只有 QA 参数会碰，线上关掉
    location ~ ^/api/(trace|logs|build)$ { return 404; }

    # 任务列表会带别人的提示词与结果：只允许建任务（POST），不允许列最近任务
    location = /api/tasks {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:39210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 首页不缓存：避免浏览器拿着旧 HTML（或 401 缓存页）看新站
    location = / {
        proxy_pass http://127.0.0.1:39210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, must-revalidate";
    }

    location / {
        proxy_pass http://127.0.0.1:39210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 生成可能跑 150s+；视频提交是异步的，但提交本身也可能慢
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
