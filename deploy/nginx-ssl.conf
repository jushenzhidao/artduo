# artduo.1task.cn :80 — ACME only, everything else to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name artduo.1task.cn;

    access_log /www/wwwlogs/artduo.1task.cn.log;
    error_log  /www/wwwlogs/artduo.1task.cn.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/acme;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# artduo.1task.cn HTTPS — proxy to the artduo container on 127.0.0.1:39120
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name artduo.1task.cn;

    ssl_certificate     /www/server/panel/vhost/cert/artduo.1task.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/artduo.1task.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # 压缩只在容器内做：边缘再压一次会破坏 ETag/Content-Length，也容易忽略客户端声明
    gzip off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    access_log /www/wwwlogs/artduo.1task.cn.log;
    error_log  /www/wwwlogs/artduo.1task.cn.error.log;

    location / {
        proxy_pass http://127.0.0.1:39120;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding   $http_accept_encoding;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        client_max_body_size 8m;
    }
}
