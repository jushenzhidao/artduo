services:
  artduo:
    image: ghcr.io/jushenzhidao/artduo:${IMAGE_TAG:-latest}
    container_name: artduo
    restart: unless-stopped
    ports:
      - "127.0.0.1:39120:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 8s
