server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;              # 必须带 Vary: Accept-Encoding，否则缓存会把 gzip 发给不支持的客户端
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain application/xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
