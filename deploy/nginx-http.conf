# artduo.1task.cn :80 — ACME + temporary HTTP proxy (TLS enabled after acme.sh install)
server {
    listen 80;
    listen [::]:80;
    server_name artduo.1task.cn;

    access_log /www/wwwlogs/artduo.1task.cn.log;
    error_log  /www/wwwlogs/artduo.1task.cn.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/acme;
        default_type "text/plain";
        allow all;
    }

    location / {
        proxy_pass http://127.0.0.1:39120;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        client_max_body_size 8m;
    }
}
