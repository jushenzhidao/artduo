# reel.1task.cn :443 —— 成片由 nginx 直出，其余反代给容器（127.0.0.1:39080）
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name reel.1task.cn;

    ssl_certificate     /www/server/panel/vhost/cert/reel.1task.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/reel.1task.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /www/wwwlogs/reel.1task.cn.log;
    error_log  /www/wwwlogs/reel.1task.cn.error.log;

    client_max_body_size 64m;   # 直传单段素材（PUT /v1/blob）要留余量
    auth_basic off;

    # 成片：直接读磁盘，不经应用（容器只写不读）
    location /files/ {
        alias /opt/reel/data/out/;
        default_type video/mp4;
        add_header Cache-Control "public, max-age=3600";
        add_header Accept-Ranges bytes;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:39081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
