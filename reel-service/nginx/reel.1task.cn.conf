# reel.1task.cn :80 —— 只做 ACME HTTP-01 与 301 跳 HTTPS
server {
    listen 80;
    server_name reel.1task.cn;

    access_log /www/wwwlogs/reel.1task.cn.log;
    error_log  /www/wwwlogs/reel.1task.cn.error.log;

    # ACME HTTP-01：必须 ^~ 且排在 location / 之前
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/acme;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
