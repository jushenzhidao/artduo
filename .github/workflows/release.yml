name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/jushenzhidao/artduo

jobs:
  release:
    # Escape hatch for docs-only pushes. The literal is intentionally only here,
    # never in a commit message we author ourselves.
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message || '', '[skip release]') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve next patch version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          LATEST="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          if [ -z "$LATEST" ]; then
            PREV=""
            LATEST="v0.0.0"
          else
            PREV="$LATEST"
          fi
          CORE="${LATEST#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$CORE"
          PATCH="${PATCH%%[-+]*}"
          NEW="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          VERSION="${NEW#v}"
          SHA="$(git rev-parse --short=7 HEAD)"
          {
            echo "version=$VERSION"
            echo "tag=$NEW"
            echo "prev=$PREV"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"

          if [ -z "$PREV" ]; then RANGE="HEAD"; else RANGE="${PREV}..HEAD"; fi
          {
            echo 'changelog<<CHANGELOG_EOF'
            git log "$RANGE" --max-count=50 --pretty='- %s (%h)' --no-merges
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "next=$NEW prev=${PREV:-none} sha=$SHA"

      - name: Build static site
        run: |
          set -euo pipefail
          npm run build
          test -f dist/index.html
          tar -czf "artduo-${{ steps.ver.outputs.version }}.tar.gz" -C dist .

      - name: Build and push image
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SHA: ${{ steps.ver.outputs.sha }}
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:sha-${SHA}" .
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:sha-${SHA}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
          CHANGELOG: ${{ steps.ver.outputs.changelog }}
          PREV: ${{ steps.ver.outputs.prev }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" "$GITHUB_SHA" -m "Release $TAG"
            git push origin "$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists -- skipping creation"
            exit 0
          fi
          {
            printf '## %s\n\n' "$TAG"
            printf '%s\n\n' "$CHANGELOG"
            if [ -n "$PREV" ]; then
              printf '**Full Changelog**: https://github.com/%s/compare/%s...%s\n' "$REPO" "$PREV" "$TAG"
            fi
          } > release-notes.md
          gh release create "$TAG" "artduo-${VERSION}.tar.gz" \
            --title "$TAG" --notes-file release-notes.md

      - name: Move latest tag
        run: |
          set -euo pipefail
          git tag -f latest "$GITHUB_SHA"
          git push -f origin latest

  deploy:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          NODE10_SSH_KEY: ${{ secrets.NODE10_SSH_KEY }}
          NODE10_HOST: ${{ secrets.NODE10_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$NODE10_SSH_KEY" > ~/.ssh/artduo_deploy
          chmod 600 ~/.ssh/artduo_deploy
          ssh-keyscan -H "$NODE10_HOST" >> ~/.ssh/known_hosts

      - name: Pull image and restart on node-10
        env:
          NODE10_HOST: ${{ secrets.NODE10_HOST }}
          NODE10_USER: ${{ secrets.NODE10_USER }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/artduo_deploy -o BatchMode=yes -o ConnectTimeout=20 \
            "$NODE10_USER@$NODE10_HOST" "/opt/artduo/bin/deploy.sh $VERSION"
